<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIVIA // MATCHMAKING</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="matchmaking-page">
    <header class="navbar">
        <a class="logo" href="index.html">ANI<span>VIA</span></a>
        <nav>
            <a href="index.html">HOME</a>
            <a href="games.html" class="active">GAMES</a>
            <a href="shop.html">SHOP</a><a href="cinema.html">CINEMA</a>
        </nav>
        <div class="nav-buttons">
            <button class="icon-button" aria-label="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="5.5"></circle><path d="M16 16L21 21"></path></svg></button>
            <button class="profile-button" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"></circle><path d="M5 19c1.7-3.1 4.2-4.7 7-4.7s5.3 1.6 7 4.7"></path></svg></button>
        </div>
    </header>

    <main class="matchmaking-shell">
        <section class="matchmaking-card">
            <span class="pixel-label">// MATCHMAKING NETWORK</span>
            <h1>ROOM FOUND</h1>
            <p id="matchStatus">Searching for a rival...</p>
            <div class="room-code"><span>ROOM</span><strong id="roomCode">----</strong></div>
            <div class="match-players">
                <div class="match-player joined"><div class="match-avatar">YOU</div><strong>YOU</strong><span>READY</span></div>
                <div class="match-vs">VS</div>
                <div class="match-player joined"><div id="opponentAvatar" class="match-avatar opponent-avatar">07</div><strong id="opponentName">SEARCHING</strong><span id="opponentState">CONNECTING</span></div>
            </div>
            <div class="match-countdown"><span id="matchCountdown">3</span></div>
            <p class="match-note">Two players connected. Starting the match...</p>
        </section>
    </main>

    <footer><div class="logo">ANI<span>VIA</span></div><p>© 2026 ANIVIA // ALL SYSTEMS ONLINE</p></footer>
    <script src="script.js"></script>
</body>
</html>
